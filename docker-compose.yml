services:
  carbon:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        # Compose can't run git itself, so pass the hash from the environment:
        #   GIT_HASH=$(git rev-parse --short HEAD) docker compose build
        # Falls back to 'unknown' when GIT_HASH isn't set.
        GIT_HASH: ${GIT_HASH:-unknown}
    ports:
      - "${PORT:-3069}:3069"
    volumes:
      - ./data:/app/data
    # Inject the whole .env (BASE_DOMAIN, HOST_ADMINS, APP_HOST, AUTH_USERS,
    # CORS_ORIGINS, VAPID_*, …). Compose also reads .env for ${...} interpolation
    # above, but only env_file / environment values reach the container process.
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned container internals — override anything in .env so the volume path
      # and listen port stay correct regardless of what .env contains.
      - DATABASE_PATH=/app/data/carbon.db
      - PORT=3069
      - NODE_ENV=production
    # Hardening. The image already drops to the unprivileged `node` user (uid
    # 1000); these keep a compromised process from escalating or persisting:
    #   read_only  — root fs is immutable, so the app can't rewrite its own
    #                bundle. Only the ./data bind mount stays writable.
    #   tmpfs      — /tmp is the one scratch path SQLite may need (temp b-trees,
    #                VACUUM); noexec/nosuid so nothing can be staged and run.
    #   cap_drop   — no capabilities at all; port 3069 is unprivileged.
    #   no-new-privileges — setuid binaries can't raise privileges.
    # If ./data was created by an older root-running container, chown it first:
    #   sudo chown -R 1000:1000 ./data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
