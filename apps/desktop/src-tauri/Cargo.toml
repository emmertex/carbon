[package]
name = "carbon-desktop"
version = "0.1.0"
description = "Carbon — a simple-on-the-surface, powerful-underneath task manager."
authors = ["Andrew Frahn"]
edition = "2021"

[lib]
name = "carbon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "carbon-desktop"
path = "src/main.rs"
