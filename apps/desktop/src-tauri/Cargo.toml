[package]
name = "carbon-desktop"
# Rust crate version only. The app/bundle version is single-sourced from the repo-root
# package.json via tauri.conf.json ("version": "../../../package.json"); this is ignored
# for the released app version.
version = "0.0.0"
description = "Carbon — a simple-on-the-surface, powerful-underneath task manager."
authors = ["Andrew Frahn"]
edition = "2021"

[lib]
name = "carbon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "carbon-desktop"
path = "src/main.rs"
