// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force every Android module onto the build-tools version actually installed in the
// SDK. AGP 8.7.3 otherwise defaults to build-tools 34.0.0 and tries to auto-install
// it, which fails against the read-only system SDK at /opt/android-sdk.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
