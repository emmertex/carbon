// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Use the project-selected SDK build tools consistently across Android modules.
subprojects {
    afterEvaluate { project ->
        if (project.name == 'capacitor-android') {
            project.android.defaultConfig.consumerProguardFiles = [
                rootProject.file('capacitor-proguard-rules.pro')
            ]
        }
        if (project.hasProperty('android')) {
            project.android {
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
